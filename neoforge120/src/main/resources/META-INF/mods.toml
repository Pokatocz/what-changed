# NeoForge 20.2 - 20.4 (FML 1-2). NeoForge 20.5+ reads META-INF/neoforge.mods.toml instead.
modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "whatchanged"
version = "${version}"
displayName = "What Changed?"
authors = "pokato"
logoFile = "assets/whatchanged/icon.png"
description = '''
Automatic modpack changelog. After every modpack update it shows exactly which mods, items, mobs, recipes, biomes, structures, enchantments and dimensions were added, removed or changed.
'''

[[dependencies.whatchanged]]
modId = "neoforge"
mandatory = true
versionRange = "[20.2,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.whatchanged]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.2,1.21.8)"
ordering = "NONE"
side = "BOTH"
