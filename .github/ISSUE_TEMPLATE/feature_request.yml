name: Idea or feature request
description: Suggest something new (something to detect, a tab, an option, …)
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should What Changed? do, and why would it help?
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Minecraft version and loader you play on
      placeholder: e.g. 1.21.1 NeoForge
