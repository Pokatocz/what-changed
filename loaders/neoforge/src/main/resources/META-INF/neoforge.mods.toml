modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "whatchanged"
version = "${version}"
displayName = "What Changed?"
authors = "pokato"
iconFile = "assets/whatchanged/icon.png"
description = '''
Automatic modpack changelog. After every modpack update it shows exactly which mods, items, mobs, recipes, biomes, structures, enchantments and dimensions were added, removed or changed.
'''

[[dependencies.whatchanged]]
modId = "neoforge"
type = "required"
versionRange = "[21.8,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.whatchanged]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.8,)"
ordering = "NONE"
side = "BOTH"
