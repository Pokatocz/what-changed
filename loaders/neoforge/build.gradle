plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
// NeoForge 1.21.8 - 26.3 in one JAR. Compiled against the oldest (21.8.x, Java 21); the 26.x GUI layer
// (client26) is compiled separately against 26.1 at Java 21 bytecode by ../../tools/build-client26.sh and packed in.
version = project.mod_version
group = 'com.pokato'
base { archivesName = 'whatchanged-neoforge-1.21.8-26.3' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.java { srcDir '../../shared/common/src/main/java'; srcDir '../../shared/shims/c1215/src/main/java'; srcDir '../../shared/client121/src/main/java' }
sourceSets.main.resources { srcDir '../../shared/common/src/main/resources' }
if (project.hasProperty('selftest')) { sourceSets.main.java { srcDir '../../tools/selftest/src/main/java' }; base.archivesName = base.archivesName.get() + '-SELFTEST' }

neoForge {
    version = '21.8.54'
    runs {
        client { client() }
        server { server() }
    }
    mods { whatchanged { sourceSet(sourceSets.main) } }
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }

jar {
    from('../../LICENSE')
    from('../../shared/client26/build/classes') // 26.x renderer layer
}
