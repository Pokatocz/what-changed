plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'java'
}
// Fabric 1.21.8 - 1.21.11. Built against 1.21.8 with Mojang mappings; Loom remaps to intermediary,
// which is stable across the four versions.
version = project.mod_version
group = 'com.pokato'
base { archivesName = 'whatchanged-fabric-1.21.8-1.21.11' }

sourceSets.main.java { srcDir '../common/src/main/java'; srcDir '../shims/c1215/src/main/java'; srcDir '../client121/src/main/java'; srcDir '../fabric-common/src/main/java' }
sourceSets.main.resources { srcDir '../common/src/main/resources' }
if (project.hasProperty('selftest')) { sourceSets.main.java { srcDir '../selftest/src/main/java' }; base.archivesName = base.archivesName.get() + '-SELFTEST' }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:1.21.8"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.14"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.136.1+1.21.8"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.encoding = "UTF-8"; it.options.release = 21 }
jar { from('../LICENSE') }
